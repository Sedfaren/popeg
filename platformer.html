function save(){
 const d={level,score,best,bestTime};
 try{localStorage.setItem(SAVE,JSON.stringify(d))}catch{}
 if(ysdk?.getPlayer)ysdk.getPlayer().then(p=>p.setData(d,true)).catch(()=>{});
}
async function load(){
 try{const x=JSON.parse(localStorage.getItem(SAVE)||"{}");best=+x.best||0;bestTime=+x.bestTime||0}catch{}
 if(ysdk?.getPlayer)try{const p=await ysdk.getPlayer();const x=await p.getData(["best","bestTime"]);if(x){best=Math.max(best,+x.best||0);if(+x.bestTime&&(!bestTime||+x.bestTime<bestTime))bestTime=+x.bestTime}}catch{}
}
load();
async function initYSDK(){
 try{if(window.YaGames){ysdk=await YaGames.init();ysdk.features?.LoadingAPI?.ready?.();await load()}}catch(e){}
 document.getElementById("loading")?.remove();
}
setTimeout(()=>document.getElementById("loading")?.remove(),2500);

function snd(type){
 if(muted)return;
 try{
  audio ||= new (window.AudioContext||window.webkitAudioContext)();
  const o=audio.createOscillator(),g=audio.createGain();
  o.connect(g);g.connect(audio.destination);
  o.frequency.value={coin:880,jump:440,hit:120,win:660,click:220,shoot:170}[type]||300;
  o.type=type==="hit"||type==="shoot"?"sawtooth":"square";
  g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);
  o.start();o.stop(audio.currentTime+.1);
 }catch{}
}
const gp=a=>ysdk?.features?.GameplayAPI?.[a]?.();
function dust(x,y,n,col="#ffffff"){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:-Math.random()*2,life:20+Math.random()*10,c:col})}

function startLevel(n=level){
 level=Math.max(0,Math.min(LV.length-1,n));L=LV[level];
 player={x:L.s[0],y:L.s[1],w:30,h:46,vx:0,vy:0,ground:false,inv:0,face:1,ph:0,on:null,sq:0,coy:0,jmp:0,fx:1};
 solids=L.p.map(p=>({x:p[0],y:p[1],w:p[2],h:p[3]}));
 (L.m||[]).forEach(m=>solids.push({x:m[0],y:m[1],w:m[2],h:m[3],bx:m[0],by:m[1],dx:m[4],dy:m[5],sp:m[6],mv:1,mx:0,my:0}));
 enemies=L.e.map(e=>({x:e[0],y:e[1],w:e[2],h:e[3],min:e[4],max:e[5],v:e[6],sh:e[7]||0,cd:70+Math.random()*50,fl:0,ph:Math.random()*6,dir:e[6]<0?-1:1}));
 coins=L.c.map(q=>({x:q[0],y:q[1],got:0}));
 springs=(L.sr||[]).map(q=>({x:q[0],y:q[1],t:0}));
 bullets=[];particles=[];pops=[];shake=0;setMusic(L.th);lt=0;cam=0;jump=false;jb=0;state="play";gp("start");
}
function newGame(){level=0;score=0;lives=3;tt=0;startLevel(0)}
function loseLife(){
 lives--;shake=14;snd("hit");dust(player.x+15,player.y+23,16,"#ff5a5a");bullets=[];
 if(lives<=0){best=Math.max(best,score);save();state="over";gp("stop")}
 else{player.x=L.s[0];player.y=L.s[1];player.vx=player.vy=0;player.inv=100}
}
function complete(){
 score+=500;best=Math.max(best,score);snd("win");gp("stop");
 if(level<LV.length-1)state="leveldone";
 else{state="win";if(!bestTime||tt<bestTime)bestTime=tt}
 save();
}
function togglePause(){
 if(state==="play"){state="pause";gp("stop")}
 else if(state==="pause"){state="play";gp("start")}
}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function rectOverlap(a,x,y,w,h){return a.x<x+w&&a.x+a.w>x&&a.y<y+h&&a.y+a.h>y}

const JK=["Space","ArrowUp","KeyW","KeyZ","KeyK","KeyJ"];
function act(){
 if(state==="menu"){snd("click");newGame()}
 else if(state==="over"||state==="win")newGame();
 else if(state==="leveldone")startLevel(level+1);
 else if(state==="pause")togglePause();
}
addEventListener("keydown",e=>{
 ensureAudio();
 if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code))e.preventDefault();
 if(e.code==="KeyM"){toggleMute();return}
 const go=e.code==="Enter"||e.code==="Space";
 if(go&&state==="help"){state="menu";return}
 if(go&&state!=="play"){keys[e.code]=true;act();return}
 if(e.code==="Escape"&&state==="help"){state="menu";return}
 if(!keys[e.code]&&JK.includes(e.code))jump=true;
 keys[e.code]=true;
 if(e.code==="Escape"||e.code==="KeyP")togglePause();
});
addEventListener("keyup",e=>keys[e.code]=false);
document.querySelectorAll(".tb").forEach(b=>{
 const k=b.dataset.key;if(k.startsWith("Arrow"))return;
 const dn=e=>{e.preventDefault();ensureAudio();if(k==="Escape"){togglePause();return}if(k==="Space"&&!keys[k])jump=true;keys[k]=true};
 const up=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener("pointerdown",dn);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",up);
});
const dp=document.getElementById("dpad");
function dpSet(e){const r=dp.getBoundingClientRect(),x=e.clientX-r.left;keys.ArrowLeft=x<r.width/2;keys.ArrowRight=x>=r.width/2}
dp.addEventListener("pointerdown",e=>{e.preventDefault();ensureAudio();try{dp.setPointerCapture(e.pointerId)}catch{}dpSet(e)});
dp.addEventListener("pointermove",e=>{if(e.buttons||e.pressure)dpSet(e)});
const dpUp=()=>{keys.ArrowLeft=keys.ArrowRight=false};
dp.addEventListener("pointerup",dpUp);dp.addEventListener("pointercancel",dpUp);
c.addEventListener("pointerdown",e=>{
 ensureAudio();
 const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 if(y<54&&x>W-70){toggleMute();return}
 if(state==="menu"){
  if(x>W/2-150&&x<W/2+150&&y>290&&y<352){snd("click");newGame()}
  else if(x>W/2-150&&x<W/2+150&&y>370&&y<425){snd("click");state="help"}
 }
 else if(state==="help")state="menu";
 else if(state==="over"||state==="win")newGame();
 else if(state==="leveldone")startLevel(level+1);
 else if(state==="pause")togglePause();
});

function update(dt){
 if(state!=="play")return;
 lt+=dt/60;tt+=dt/60;
 for(const s of solids)if(s.mv){const f=.5-.5*Math.cos(lt*1.5*s.sp),nx=s.bx+s.dx*f,ny=s.by+s.dy*f;s.mx=nx-s.x;s.my=ny-s.y;s.x=nx;s.y=ny}
 const p=player;
 if(p.on&&p.on.mv){p.x+=p.on.mx;p.y+=p.on.my}
 const left=keys.ArrowLeft||keys.KeyA||pad.l,right=keys.ArrowRight||keys.KeyD||pad.r,held=JK.some(k=>keys[k])||pad.j;
 const dir=(right?1:0)-(left?1:0),turn=dir&&p.vx*dir<-1;
 const rate=L.ice?(turn?.1:.07):p.ground?(turn?.42:.26):(turn?.22:.15);
 if(turn&&p.ground&&Math.random()<.5*dt)dust(p.x+15,p.y+46,2,"#ffffffaa");
 if(dir)p.face=dir;p.fx+=(p.face-p.fx)*(1-Math.pow(.62,dt));
 p.vx+=(dir*6-p.vx)*(1-Math.pow(1-rate,dt));
 if(!dir&&Math.abs(p.vx)<.05)p.vx=0;
 if(jump){jb=9;jump=false}
 jb=Math.max(0,jb-dt);p.coy=p.ground?8:Math.max(0,p.coy-dt);
 if(jb>0&&p.coy>0){p.vy=-13.2;p.ground=false;p.on=null;p.coy=0;jb=0;p.jmp=1;snd("jump");dust(p.x+15,p.y+46,5)}
